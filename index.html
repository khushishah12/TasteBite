<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-image: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-box {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 350px;
      animation: slideIn 1s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #e63946;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #e63946;
      outline: none;
      box-shadow: 0 0 8px rgba(230, 57, 70, 0.3);
    }

    .btn {
      width: 100%;
      background-color: #e63946;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn:hover {
      background-color: #d62828;
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .footer a {
      color: #e63946;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="form-box" id="loginBox">
    <h2>Welcome to TasteBite</h2>
    <form id="loginForm" action=login.php method=post >
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="un" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="Pw" required />
      </div>
      <button class="btn" type="submit">Login</button>
      <div class="footer">
        Don't have an account? <a onclick="showSignUp()">Register</a>
      </div>
    </form>
  </div>

  <div class="form-box" id="signupBox" style="display: none;">
    <h2>Create Account</h2>
    <form id="signupForm" action=SignUp.php method=post>
      <div class="input-group">
        <label for="newUsername">Username</label>
        <input type="text" id="newUsername" name="un" required />
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="eml" required />
      </div>
      <div class="input-group">
        <label for="newPassword">Password</label>
        <input type="password" id="newPassword" name="pw" required />
      </div>
      <button class="btn" type="submit">Sign Up</button>
      <div class="footer">
        Already have an account? <a onclick="showLogin()">Login</a>
      </div>
    </form>
  </div>

  <script>
    const loginBox = document.getElementById('loginBox');
    const signupBox = document.getElementById('signupBox');

    function showSignUp() {
      loginBox.style.display = 'none';
      signupBox.style.display = 'block';
    }

    function showLogin() {
      signupBox.style.display = 'none';
      loginBox.style.display = 'block';
    }

  </script>
</body>
</html>
